plugins {
	// Architectury Loom builds NeoForge mods with Yarn names, so the source
	// stays in the same mappings as the Fabric branches (fabric-1.21.1) and a
	// port between them only swaps the Fabric API calls for NeoForge events.
	id 'dev.architectury.loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'NeoForged'
		url = 'https://maven.neoforged.net/releases/'
	}
}

loom {
	// This branch is Minecraft 1.21.1 on NeoForge with vanilla content only.
	// Run folders live next to the repo (MapGeneratorMods/runs/), not in it,
	// so worlds and run mods stay out of the working tree.
	runs {
		client {
			runDir = "../runs/neoforge-1.21.1"
			// 8G covers single-player (client + integrated server); more than
			// that runs a 16 GB machine out of RAM
			vmArg "-Xmx8G"
		}
		server {
			// a dedicated server gets its own folder, which is what gets
			// copied to a real server
			runDir = "../runs/neoforge-1.21.1-server"
			vmArg "-Xmx4G"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered {
		it.mappings("net.fabricmc:yarn:${project.yarn_mappings}:v2")
		// fixes the Yarn names NeoForge's patches clash with
		it.mappings("dev.architectury:yarn-mappings-patch-neoforge:${project.yarn_mappings_patch_neoforge}")
	}
	neoForge "net.neoforged:neoforge:${project.neoforge_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
