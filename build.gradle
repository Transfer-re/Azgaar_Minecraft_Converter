plugins {
	// Architectury Loom builds Forge mods with Yarn names, so the source stays
	// in the same mappings as the Fabric branch (fabric-1.20.1) and a port
	// between them only swaps the Fabric API calls for Forge events.
	id 'dev.architectury.loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// Loom adds the Minecraft, Forge and Architectury repositories itself.
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

loom {
	forge {
		mixinConfig "fantasymapgenerator.mixins.json"
		mixinConfig "fantasymapgenerator.client.mixins.json"
	}

	// This branch is Minecraft 1.20.1 on Forge, with the Conquest Reforged
	// content like fabric-1.20.1. Run folders live next to the repo
	// (MapGeneratorMods/runs/), not in it, so worlds and run mods stay out of
	// the working tree.
	runs {
		client {
			runDir = "../runs/forge-1.20.1"
			// a Conquest modpack needs a modpack-sized heap; 8G covers
			// single-player without running a 16 GB machine out of RAM
			vmArg "-Xmx8G"
		}
		server {
			// a dedicated server gets its own folder, which is what gets
			// copied to a real server
			runDir = "../runs/forge-1.20.1-server"
			vmArg "-Xmx4G"
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	forge "net.minecraftforge:forge:${project.forge_version}"

	// Forge 1.20.1 doesn't ship MixinExtras (Fabric Loader and NeoForge do), so
	// it goes into the jar (jar-in-jar) for @ModifyReturnValue / @WrapOperation
	compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${project.mixinextras_version}"))
	implementation(include("io.github.llamalad7:mixinextras-forge:${project.mixinextras_version}"))

	// Conquest Reforged in the dev runs only. Forge dev runs don't remap jars
	// dropped into runs/*/mods (Fabric's do), so it has to come through Loom.
	modLocalRuntime "maven.modrinth:conquest-reforged:${project.conquest_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("META-INF/mods.toml") {
		expand "version": inputs.properties.version
	}

	// The Conquest trees are structure files that tools/fmgtrees/treegen.py
	// generates from TreeGenerator. A jar without them still loads but places no
	// trees at all, so refuse to build one.
	def trees = file("src/main/resources/data/fantasymapgenerator/structures/treegen")
	doFirst {
		if (fileTree(trees).matching { include "**/*.nbt" }.isEmpty()) {
			throw new GradleException("No tree structures in ${trees}: run tools/fmgtrees/treegen.py first")
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
