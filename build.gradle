plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	// This branch is Minecraft 1.20.1: its dev runs get their own folder so
	// their mods (Conquest Reforged) and worlds never mix with the 1.21.4
	// branch's. Run folders live next to the repo (MapGeneratorMods/runs/),
	// not in it, so worlds and run mods stay out of the working tree.
	runs {
		client {
			runDir = "../runs/fabric-1.20.1"
			// the ArdaCraft mod set in runs/fabric-1.20.1/mods needs a modpack-sized heap;
			// 8G covers single-player (client + integrated server) without
			// Distant Horizons -- more than that runs a 16 GB machine out of RAM
			vmArg "-Xmx8G"
			// Loom runs 1.20.1 on LWJGL 3.3.2-snapshot under Java 21; Sodium 0.5
			// refuses anything but 3.3.1 unless this check is switched off
			vmArg "-Dsodium.checks.issue2561=false"
		}
		server {
			// a dedicated server can't load the client-only mods, so it gets its
			// own folder: runs/fabric-1.20.1-server/mods is the server-side subset of
			// runs/fabric-1.20.1/mods, and the folder is what gets copied to a real server
			runDir = "../runs/fabric-1.20.1-server"
			// enough for local testing with one player; a pregen box wants 8-10G
			vmArg "-Xmx4G"
		}
	}

	mods {
		"fantasymapgenerator" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
	// Gson for JSON parsing
	implementation 'com.google.code.gson:gson:2.10.1'
	
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}

	// The Conquest trees are structure files that tools/fmgtrees/treegen.py
	// generates from TreeGenerator. A jar without them still loads but places no
	// trees at all, so refuse to build one.
	def trees = file("src/main/resources/data/fantasymapgenerator/structures/treegen")
	doFirst {
		if (fileTree(trees).matching { include "**/*.nbt" }.isEmpty()) {
			throw new GradleException("No tree structures in ${trees}: run tools/fmgtrees/treegen.py first")
		}
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}