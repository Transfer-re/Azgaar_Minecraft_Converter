# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Architectury Loom builds for this loader
loom.platform=neoforge

# NeoForge Properties
# check these on https://projects.neoforged.net/neoforged/neoforge
minecraft_version=1.21.1
neoforge_version=21.1.259
loom_version=1.14.476
yarn_mappings=1.21.1+build.3
yarn_mappings_patch_neoforge=1.21+build.4
# Mod Properties
mod_version=1.0.0
maven_group=com.example
archives_base_name=fantasymapgenerator
